name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changeset status compares against main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build tokens (fails if a theme is missing a token)
        run: npm run build

      - name: Check the package contents
        run: npm pack --dry-run --workspace packages/tokens

      - name: Require a changeset for package changes
        if: github.head_ref != 'changeset-release/main'
        run: npx changeset status --since=origin/main
